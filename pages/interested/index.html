<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Canvas of Kindness</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Relative links to your root CSS stylesheets -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/pages.css">
    <link rel="stylesheet" href="../../css/mobile.css">

    <!-- Google Fonts: Lobster, Fredoka, & Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lobster&family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(180deg, #FDF0F7 0%, #F8E3F2 40%, #FAEEF6 100%);
            min-height: 100vh;
            color: #5D3E68;
        }

        .brand-font {
            font-family: 'Fredoka', sans-serif;
        }

        .script-font {
            font-family: 'Lobster', cursive;
        }

        /* --- Custom Double Accent Line --- */
        .double-line {
            border-top: 2px solid #C490D1;
            border-bottom: 2px solid #C490D1;
            height: 6px;
            width: 100%;
            max-width: 600px;
            margin: 0.5rem auto 0;
        }

        /* --- Arch Background Wrapper --- */
        .arch-bg {
            background: linear-gradient(180deg, rgba(248, 222, 240, 0.6) 0%, rgba(253, 240, 247, 0.8) 100%);
            border-radius: 50% 50% 0 0 / 20% 20% 0 0;
            padding-top: 3rem;
            margin-top: 2rem;
        }

        /* --- Social Pill Button Style --- */
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 380px;
            height: 60px;
            background-color: #9d5db8;
            color: #ffffff;
            font-family: 'Lobster', cursive !important;
            font-size: 1.6rem;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 6px 18px rgba(157, 93, 184, 0.25);
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background-color: #894ba3;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 24px rgba(157, 93, 184, 0.4), 0 0 18px rgba(220, 160, 230, 0.6);
        }

        /* Large Round Brand Icon Box */
        .brand-icon-box {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: white;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .social-row:hover .brand-icon-box {
            transform: scale(1.08);
        }

        /* Official Social Brand Colors */
        .icon-instagram {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        }

        .icon-discord {
            background-color: #5865F2;
        }

        .icon-tiktok {
            background-color: #000000;
        }

        .icon-email {
            background-color: #7b4eb2;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #FDF0F7; }
        ::-webkit-scrollbar-thumb { background: #D898CD; border-radius: 5px; }
    </style>
</head>
<body class="antialiased pb-20 selection:bg-purple-200 selection:text-purple-900">

    <!-- Top Navigation Bar -->
    <nav class="w-full py-5 px-6 md:px-12 flex items-center justify-between z-50">
        <a href="../../index.html" class="brand-font text-2xl font-bold text-[#8E53A8] tracking-tight hover:opacity-90 transition">
            Canvas of Kindness
        </a>

        <div class="hidden lg:flex items-center space-x-7 text-sm font-semibold text-[#855B94]">
            <a href="../../index.html" class="hover:text-[#8E53A8] transition">Home</a>
            <a href="../volunteer/index.html" class="hover:text-[#8E53A8] transition">Volunteer</a>
            <a href="../chapters/index.html" class="hover:text-[#8E53A8] transition">Chapters</a>
            <a href="../executive-team/index.html" class="hover:text-[#8E53A8] transition">Executive Team</a>
            <a href="../support-us/index.html" class="hover:text-[#8E53A8] transition">Support Us</a>
            <a href="index.html" class="text-[#8E53A8] border-b-2 border-[#8E53A8] pb-0.5">Contact Us</a>
        </div>

        <div class="flex items-center space-x-4 text-[#855B94] text-lg">
            <a href="https://instagram.com" target="_blank" aria-label="Instagram" class="hover:text-[#8E53A8] transition"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://discord.com" target="_blank" aria-label="Discord" class="hover:text-[#8E53A8] transition"><i class="fa-brands fa-discord"></i></a>
            <a href="https://tiktok.com" target="_blank" aria-label="TikTok" class="hover:text-[#8E53A8] transition"><i class="fa-brands fa-tiktok"></i></a>
            <a href="mailto:contact@canvasofkindness.org" aria-label="Email" class="hover:text-[#8E53A8] transition"><i class="fa-regular fa-envelope"></i></a>
        </div>
    </nav>

    <!-- Header Section -->
    <header class="pt-8 text-center px-6 max-w-3xl mx-auto">
        <h1 class="brand-font text-5xl sm:text-6xl font-bold text-[#8E53A8] tracking-tight">
            Interested?
        </h1>
        <p class="script-font text-3xl sm:text-4xl text-[#9E57B8] mt-1">
            Contact us today!
        </p>
        <div class="double-line"></div>
    </header>

    <!-- Arch Background & Links Container -->
    <main class="max-w-4xl mx-auto px-6">
        <div class="arch-bg flex flex-col items-center">

            <!-- Circular Logo Placeholder -->
            <div class="w-44 h-44 rounded-full bg-white p-3 shadow-lg flex items-center justify-center border-4 border-white mb-10 transform hover:scale-105 transition duration-300">
                <div class="w-full h-full rounded-full bg-[#FCE6F5] border-2 border-dashed border-[#C490D1] flex flex-col items-center justify-center text-center p-3">
                    <span class="brand-font text-sm font-bold text-[#8E53A8]">canvas of</span>
                    <span class="script-font text-xl text-[#A05BB8]">kindness</span>
                    <span class="text-[10px] text-[#A87BB9] mt-0.5">est. 2024</span>
                </div>
            </div>

            <!-- Social Links Stack -->
            <div class="w-full max-w-md space-y-6 pb-12">
                
                <!-- Instagram -->
                <div class="social-row flex items-center justify-center gap-6">
                    <div class="brand-icon-box icon-instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <a href="https://instagram.com" target="_blank" class="social-btn">
                        Instagram
                    </a>
                </div>

                <!-- Discord -->
                <div class="social-row flex items-center justify-center gap-6">
                    <div class="brand-icon-box icon-discord">
                        <i class="fa-brands fa-discord"></i>
                    </div>
                    <a href="https://discord.com" target="_blank" class="social-btn">
                        Discord
                    </a>
                </div>

                <!-- TikTok -->
                <div class="social-row flex items-center justify-center gap-6">
                    <div class="brand-icon-box icon-tiktok">
                        <i class="fa-brands fa-tiktok"></i>
                    </div>
                    <a href="https://tiktok.com" target="_blank" class="social-btn">
                        Tiktok
                    </a>
                </div>

                <!-- Email -->
                <div class="social-row flex items-center justify-center gap-6">
                    <div class="brand-icon-box icon-email">
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                    <a href="mailto:contact@canvasofkindness.org" class="social-btn">
                        Email
                    </a>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="contact" class="mt-12 text-center text-xs text-[#8F6A9B] font-medium">
        <p>&copy; 2026 Canvas of Kindness Foundation. All rights reserved.</p>
    </footer>

    <!-- Relative JS links pointing to root /js folder -->
    <script src="../../js/navigation.js"></script>
    <script src="../../js/app.js"></script>
</body>
</html>
